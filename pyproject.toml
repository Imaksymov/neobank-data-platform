[project]
name = "neobank-data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=17.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "faker>=40.43.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "PD", "RUF"]
# RUF001-003 ловят омоглифы — символы, похожие на латинские (кириллическая
# "а" вместо "a"). Правило полезное, но документация проекта на русском,
# и предпосылка "двойник попал случайно" здесь не выполняется.
# В именах переменных и идентификаторах кириллица по-прежнему недопустима —
# это соглашение, а не проверка линтера.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-q --cov=ingestion --cov-report=term-missing"
testpaths = ["tests"]
